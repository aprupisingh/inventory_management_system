<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>New Sale</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="new-sale-page">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3 class="mb-0">
                🛒 Create New Sale
            </h3>

        </div>

        <div class="card-body">

            <form method="POST"
                  action="/new-sale">


                <!-- CUSTOMER -->

                <div class="mb-3">

                    <label class="form-label fw-bold">

                        👤 Select Customer

                    </label>

                    <select
                        name="customer_id"
                        class="form-select"
                        required>

                        <option value="">
                            -- Select Customer --
                        </option>

                        {% for customer in customers %}

                        <option value="{{ customer['customer_id'] }}">

                            {{ customer['customer_name'] }}

                            {% if customer['phone'] %}
                                - {{ customer['phone'] }}
                            {% endif %}

                        </option>

                        {% endfor %}

                    </select>

                    <div class="mt-2">

                        <a href="/customers"
                           class="btn btn-sm btn-outline-success">

                            ➕ Add Customer

                        </a>

                    </div>

                </div>


                <!-- PRODUCT -->

                <div class="mb-3">

                    <label class="form-label fw-bold">

                        📦 Select Product

                    </label>

                    <select
                        name="product_id"
                        class="form-select"
                        required>

                        <option value="">
                            -- Select Product --
                        </option>

                        {% for product in products %}

                        <option value="{{ product['product_id'] }}">

                            {{ product['product_name'] }}

                            | Stock: {{ product['quantity'] }}

                            | ₹{{ "%.2f"|format(product['price']) }}

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- QUANTITY -->

                <div class="mb-4">

                    <label class="form-label fw-bold">

                        🔢 Quantity

                    </label>

                    <input
                        type="number"
                        name="quantity"
                        class="form-control"
                        min="1"
                        required>

                </div>

                <div class="row mb-4">
                    <div class="col-md-6">
                        <label for="discount" class="form-label fw-bold">Discount (₹)</label>
                        <input id="discount" type="number" name="discount" class="form-control" min="0" step="0.01" value="0" required>
                    </div>
                    <div class="col-md-6">
                        <label for="gst_rate" class="form-label fw-bold">GST (%)</label>
                        <input id="gst_rate" type="number" name="gst_rate" class="form-control" min="0" step="0.01" value="18" required>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-4">
                        <label for="payment_method" class="form-label fw-bold">Payment Method</label>
                        <select id="payment_method" name="payment_method" class="form-select" required>
                            <option>Cash</option>
                            <option>UPI</option>
                            <option>Credit Card</option>
                            <option>Debit Card</option>
                            <option>Net Banking</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="payment_amount" class="form-label fw-bold">Payment Amount (₹)</label>
                        <input id="payment_amount" type="number" name="payment_amount" class="form-control" min="0" step="0.01" required>
                    </div>
                    <div class="col-md-4">
                        <label for="payment_status" class="form-label fw-bold">Payment Status</label>
                        <select id="payment_status" name="payment_status" class="form-select" required>
                            <option>Paid</option>
                            <option>Pending</option>
                            <option>Partially Paid</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-6">
                        <label for="payment_date" class="form-label fw-bold">Payment Date</label>
                        <input id="payment_date" type="date" name="payment_date" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label for="transaction_id" class="form-label fw-bold">Transaction ID</label>
                        <input id="transaction_id" type="text" name="transaction_id" class="form-control" maxlength="100">
                    </div>
                </div>


                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-success">

                        🧾 Complete Sale & Generate Invoice

                    </button>

                    <a href="/sales"
                       class="btn btn-secondary">

                        Cancel

                    </a>

                </div>


            </form>

        </div>

    </div>

</div>

</body>

</html>
