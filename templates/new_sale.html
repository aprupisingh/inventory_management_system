<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>New Sale</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3 class="mb-0">
                🛒 Create New Sale
            </h3>

        </div>

        <div class="card-body">

            <form method="POST"
                  action="/new-sale">


                <!-- CUSTOMER -->

                <div class="mb-3">

                    <label class="form-label fw-bold">

                        👤 Select Customer

                    </label>

                    <select
                        name="customer_id"
                        class="form-select"
                        required>

                        <option value="">
                            -- Select Customer --
                        </option>

                        {% for customer in customers %}

                        <option value="{{ customer['customer_id'] }}">

                            {{ customer['customer_name'] }}

                            {% if customer['phone'] %}
                                - {{ customer['phone'] }}
                            {% endif %}

                        </option>

                        {% endfor %}

                    </select>

                    <div class="mt-2">

                        <a href="/customers"
                           class="btn btn-sm btn-outline-success">

                            ➕ Add Customer

                        </a>

                    </div>

                </div>


                <!-- PRODUCT -->

                <div class="mb-3">

                    <label class="form-label fw-bold">

                        📦 Select Product

                    </label>

                    <select
                        name="product_id"
                        class="form-select"
                        required>

                        <option value="">
                            -- Select Product --
                        </option>

                        {% for product in products %}

                        <option value="{{ product['product_id'] }}">

                            {{ product['product_name'] }}

                            | Stock: {{ product['quantity'] }}

                            | ₹{{ "%.2f"|format(product['price']) }}

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- QUANTITY -->

                <div class="mb-4">

                    <label class="form-label fw-bold">

                        🔢 Quantity

                    </label>

                    <input
                        type="number"
                        name="quantity"
                        class="form-control"
                        min="1"
                        required>

                </div>


                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-success">

                        🧾 Complete Sale & Generate Invoice

                    </button>

                    <a href="/sales"
                       class="btn btn-secondary">

                        Cancel

                    </a>

                </div>


            </form>

        </div>

    </div>

</div>

</body>

</html>
