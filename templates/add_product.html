<!DOCTYPE html>

<html>

<head>

<title>Add Product</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body class="container mt-5">

<h2>Add Product</h2>

<form method="POST">

<input
type="text"
name="name"
class="form-control mb-3"
placeholder="Product Name"
required>

<input
type="text"
name="category"
class="form-control mb-3"
placeholder="Category"
required>

<input
type="number"
name="quantity"
class="form-control mb-3"
placeholder="Quantity"
required>

<input
type="number"
step="0.01"
name="price"
class="form-control mb-3"
placeholder="Price"
required>

<button class="btn btn-primary">
Save Product
</button>

<a href="/" class="btn btn-secondary">
Back
</a>

</form>

</body>

</html>
