<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Sale</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow mx-auto" style="max-width: 650px;">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">Edit Sale #{{ sale['sale_id'] }}</h3>
            </div>
            <div class="card-body">
                <form method="POST">
                    <label for="customer_id" class="form-label fw-bold">Customer</label>
                    <select id="customer_id" name="customer_id" class="form-select mb-3" required>
                        {% for customer in customers %}
                            <option value="{{ customer['customer_id'] }}" {% if customer['customer_id'] == sale['customer_id'] %}selected{% endif %}>
                                {{ customer['customer_name'] }}{% if customer['phone'] %} - {{ customer['phone'] }}{% endif %}
                            </option>
                        {% endfor %}
                    </select>

                    <label for="product_id" class="form-label fw-bold">Product</label>
                    <select id="product_id" name="product_id" class="form-select mb-3" required>
                        {% for product in products %}
                            <option value="{{ product['product_id'] }}" {% if product['product_id'] == sale['product_id'] %}selected{% endif %}>
                                {{ product['product_name'] }} | Stock: {{ product['quantity'] }} | ₹{{ "%.2f"|format(product['price']) }}
                            </option>
                        {% endfor %}
                    </select>

                    <label for="quantity" class="form-label fw-bold">Quantity</label>
                    <input id="quantity" type="number" name="quantity" class="form-control mb-3" min="1" value="{{ sale['quantity'] }}" required>

                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label for="discount" class="form-label fw-bold">Discount (₹)</label>
                            <input id="discount" type="number" name="discount" class="form-control" min="0" step="0.01" value="{{ sale['discount'] }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="gst_rate" class="form-label fw-bold">GST (%)</label>
                            <input id="gst_rate" type="number" name="gst_rate" class="form-control" min="0" step="0.01" value="{{ sale['gst_rate'] }}" required>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-4">
                            <label for="payment_method" class="form-label fw-bold">Payment Method</label>
                            <select id="payment_method" name="payment_method" class="form-select" required>
                                {% for method in ['Cash', 'UPI', 'Credit Card', 'Debit Card', 'Net Banking'] %}
                                    <option {% if method == sale['payment_method'] %}selected{% endif %}>{{ method }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="payment_amount" class="form-label fw-bold">Payment Amount (₹)</label>
                            <input id="payment_amount" type="number" name="payment_amount" class="form-control" min="0" step="0.01" value="{{ sale['payment_amount'] }}" required>
                        </div>
                        <div class="col-md-4">
                            <label for="payment_status" class="form-label fw-bold">Payment Status</label>
                            <select id="payment_status" name="payment_status" class="form-select" required>
                                {% for status in ['Paid', 'Pending', 'Partially Paid'] %}
                                    <option {% if status == sale['payment_status'] %}selected{% endif %}>{{ status }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label for="payment_date" class="form-label fw-bold">Payment Date</label>
                            <input id="payment_date" type="date" name="payment_date" class="form-control" value="{{ sale['payment_date'][:10] if sale['payment_date'] else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label for="transaction_id" class="form-label fw-bold">Transaction ID</label>
                            <input id="transaction_id" type="text" name="transaction_id" class="form-control" maxlength="100" value="{{ sale['transaction_id'] or '' }}">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success">Save Changes</button>
                    <a href="/sales" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
